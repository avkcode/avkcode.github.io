<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IngressLabs security boundary diagram</title>
  <desc id="desc">A sparse graphite and silver security-boundary diagram with nested private zones, a central sandbox, and controlled ingress and egress paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.64" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 480) rotate(90) scale(330 520)">
      <stop offset="0" stop-color="#edf1f5" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#b8bdc4" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boundary" x1="180" y1="300" x2="1420" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#737b85" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#edf1f5" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#737b85" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="points" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.2" fill="#b8bdc4" fill-opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-18%" y="-24%" width="136%" height="156%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#points)" opacity="0.76"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g transform="translate(80 74)" opacity="0.9">
    <image href="ingresslabs-logo-mark.svg" width="92" height="92" preserveAspectRatio="xMinYMid meet"/>
  </g>
  <g transform="translate(1270 96)" opacity="0.18">
    <image href="ingresslabs-logo-mark.svg" width="220" height="220"/>
  </g>

  <g fill="none">
    <rect x="130" y="278" width="1340" height="498" rx="28" stroke="url(#boundary)" stroke-width="2.5"/>
    <rect x="204" y="338" width="1192" height="378" rx="22" stroke="#b8bdc4" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="292" y="402" width="1016" height="250" rx="18" stroke="#edf1f5" stroke-opacity="0.34" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="624" y="446" width="352" height="162" rx="18" fill="#101014" stroke="#edf1f5" stroke-opacity="0.46"/>
    <rect x="678" y="486" width="244" height="82" rx="14" fill="#edf1f5" fill-opacity="0.04" stroke="#b8bdc4" stroke-opacity="0.28"/>
    <path d="M720 527H880" stroke="#edf1f5" stroke-opacity="0.38" stroke-width="2" stroke-linecap="round"/>
    <circle cx="800" cy="527" r="14" fill="#edf1f5"/>
    <circle cx="800" cy="527" r="43" fill="none" stroke="#edf1f5" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <g fill="#0a0a0c" stroke="#b8bdc4" stroke-opacity="0.3" stroke-width="2">
    <circle cx="382" cy="488" r="54"/>
    <circle cx="382" cy="596" r="54"/>
    <circle cx="1218" cy="488" r="54"/>
    <circle cx="1218" cy="596" r="54"/>
  </g>
  <g fill="#edf1f5">
    <circle cx="382" cy="488" r="11" opacity="0.9"/>
    <circle cx="382" cy="596" r="11" opacity="0.64"/>
    <circle cx="1218" cy="488" r="11" opacity="0.9"/>
    <circle cx="1218" cy="596" r="11" opacity="0.64"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M436 488H624M436 596H624" stroke="#edf1f5" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M976 488H1164M976 596H1164" stroke="#b8bdc4" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M514 488C552 448 590 448 624 488" stroke="#edf1f5" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M976 596C1014 636 1090 636 1164 596" stroke="#b8bdc4" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <g opacity="0.22" fill="none" stroke="#edf1f5" stroke-width="1.6">
    <path d="M180 820H1420"/>
    <path d="M270 790H1330"/>
    <path d="M360 760H1240"/>
  </g>
</svg>
