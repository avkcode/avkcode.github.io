<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">IngressLabs logo mark</title>
  <desc id="desc">A thin silver radial ingress glyph based on the reference circular route mark.</desc>
  <defs>
    <linearGradient id="silver" x1="58" y1="42" x2="202" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#a8afb8"/>
      <stop offset="0.36" stop-color="#f7f9fb"/>
      <stop offset="0.58" stop-color="#737b85"/>
      <stop offset="0.82" stop-color="#d9dfe6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="route" x1="54" y1="128" x2="202" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9098a2"/>
      <stop offset="0.5" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#8f98a3"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <circle cx="128" cy="128" r="78" stroke="url(#silver)" stroke-width="3.2"/>
    <circle cx="128" cy="128" r="67" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2"/>
    <g stroke="url(#route)">
      <path d="M128 66v46M128 144v46" stroke-width="4.2"/>
      <path d="M66 128h46M144 128h46" stroke-width="4.2"/>
      <path d="M88 88l28 28M140 140l28 28" stroke-width="3"/>
      <path d="M168 88l-28 28M116 140l-28 28" stroke-width="3"/>
    </g>
    <circle cx="128" cy="128" r="5.8" fill="#050505" stroke="url(#silver)" stroke-width="2"/>
    <circle cx="128" cy="128" r="1.8" fill="#f7f9fb"/>
  </g>
</svg>
